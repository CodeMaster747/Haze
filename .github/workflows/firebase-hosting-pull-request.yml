name: Deploy preview to Firebase Hosting on PR

on: pull_request

# Forks cannot read repository secrets, so the deploy step would fail with a
# confusing "input required" error. Skip it explicitly instead.
concurrency:
  group: deploy-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: cd web && npm ci && npm run build:demo

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HAZE }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          expires: 7d
