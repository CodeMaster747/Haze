name: Deploy preview to Firebase Hosting on PR

on: pull_request

concurrency:
  group: deploy-preview-${{ github.ref }}
  cancel-in-progress: true

# The repository's default workflow token is read-only, and on a pull_request
# this action does two things that write: it opens a check run for the deploy
# and it comments the preview URL onto the PR. Without these it fails with a
# bare "Resource not accessible by integration" 403 AFTER uploading, so the
# preview exists but nothing ever tells you its address. The merge workflow
# needs none of this -- on a push the action only deploys.
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  preview:
    # Two guards: forks cannot read repository secrets, and the whole workflow
    # is a no-op until Firebase is configured (see DEPLOY.md).
    if: github.event.pull_request.head.repo.full_name == github.repository && vars.FIREBASE_PROJECT_ID != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: cd web && npm ci && npm run build:demo

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HAZE }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          expires: 7d
