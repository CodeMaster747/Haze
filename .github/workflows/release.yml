name: Publish to PyPI

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Trusted Publishing: PyPI verifies this workflow's OIDC identity, so there is
# no API token to store or rotate. It does NOT work from inside a reusable
# workflow, which is why this is a normal one.
permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build the wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the dashboard into the package
        # The agent serves its own UI, so a wheel without it is useless. This
        # is the same sequence `make build-web` runs.
        run: |
          cd web && npm ci && npm run build && cd ..
          rm -rf agent/src/haze/webui
          cp -R web/dist agent/src/haze/webui

      - name: Build
        run: |
          pip install build
          python -m build agent --outdir dist

      - name: The wheel must contain the dashboard
        # agent/src/haze/webui is gitignored, and hatchling honours .gitignore.
        # Only the `artifacts` entry in pyproject.toml puts it in the wheel, and
        # shipping an agent whose dashboard is a "not built" placeholder would
        # be a bad thing to discover from a user.
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          wheel = glob.glob("dist/haze_agent-*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          if not any(n.endswith("haze/webui/index.html") for n in names):
              sys.exit(f"{wheel} has no dashboard")
          print(f"{wheel}: dashboard present")
          PY

      - name: The tag must match the package version
        # A tag that disagrees with pyproject.toml publishes a version nobody
        # asked for, and PyPI releases cannot be replaced.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import glob, os, sys
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          wheel = os.path.basename(glob.glob("dist/haze_agent-*.whl")[0])
          version = wheel.split("-")[1]
          if tag != version:
              sys.exit(f"tag v{tag} does not match package version {version}")
          print(f"tag v{tag} matches the package")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    # Only real tags publish. workflow_dispatch builds and checks without
    # releasing, so the pipeline can be exercised safely.
    if: startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        # No `password:` on purpose — Trusted Publishing supplies the
        # credential via OIDC, and Sigstore attestations are generated by
        # default for projects that use it.
