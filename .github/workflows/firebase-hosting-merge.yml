name: Deploy to Firebase Hosting on merge

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hosting
  cancel-in-progress: true

jobs:
  deploy:
    # Skips cleanly until Firebase is set up (see DEPLOY.md). Without this the
    # deploy fails on every push with a confusing "input required" error and
    # leaves a red X on a repo whose code is actually fine.
    if: vars.FIREBASE_PROJECT_ID != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the demo bundle
        # build:demo, NOT build. The hosted site runs an in-browser simulated
        # cluster and must ship no code path that could contact a local agent.
        run: cd web && npm ci && npm run build:demo

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HAZE }}
          channelId: live
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
